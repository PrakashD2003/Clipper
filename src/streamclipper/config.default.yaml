# StreamClipper Default Configuration
# Copy this to config.yaml and customize.
# Fields set to "auto" are resolved dynamically at runtime via HardwareProfile
# based on detected GPU VRAM, CUDA Compute Capability (Tensor Cores), and FFmpeg NVENC support.

general:
  output_dir: "./output"
  temp_dir: "./temp"
  cache_dir: "./.cache"
  max_concurrent_streams: 2
  log_level: "INFO"
  cross_process_gpu_lock: true         # Serialize GPU work across processes with a file lock (.cache/gpu.lock)

discovery:
  platform: "youtube"
  default_game: "GTA 6"
  game_keywords: ["GTA 6", "Grand Theft Auto 6", "GTA VI"]
  min_viewers: 1000
  max_streams: 10
  min_duration_hours: 1  # skip short videos
  language: "en-US"      # Target search language (Accept-Language + yt-dlp youtube lang)
  region: "US"           # Target search country/region (geo_bypass_country)
  proxy: ""              # Optional HTTP/SOCKS5 proxy for yt-dlp discovery
  max_age_days: 30       # Skip streams older than N days
  require_title_match: true  # Require a game keyword in the stream title
  blocked_streamers: []      # Channel/uploader names (case-insensitive) to never clip

download:
  retries: 3             # Retry count for transient download failures

transcription:
  engine: "whisperx"      # whisperx | faster-whisper
  model_size: "auto"      # auto | tiny | base | small | medium | large-v2
  device: "auto"          # auto | cpu | cuda
  compute_type: "auto"    # auto | float16 | int8_float16 | int8
  language: "auto"
  batch_size: "auto"      # auto | integer (e.g. 4, 8, 16)

analysis:
  chunk_minutes: 12
  min_clip_seconds: 15
  max_clip_seconds: 45
  hard_max_clip_seconds: 180          # Ranges longer than this are rejected outright (Shorts limit)
  adjust_clip_bounds: true            # Widen short / trim long moments instead of rejecting them
  max_clips_per_stream: 5
  min_highlight_score: 7.0
  skip_intro_minutes: 5                # Ignore the first N minutes of a stream (intro / starting screen)
  skip_high_music: true                # Skip (instead of penalize) highlights flagged HIGH_MUSIC_DETECTED
  copyright_check: true                # Pre-flight acoustic music risk check on speech gaps
  music_risk_threshold: 0.65           # Harmonic-percussive music confidence threshold
  music_penalty_factor: 0.80           # Score multiplier for clips flagged with high music
  copyright:
    enabled: true
    min_gap_seconds: 2.0               # Min TOTAL non-speech audio that must be tested; less -> music_risk UNKNOWN (never a false CLEAN)
    high_risk_threshold: 0.65
    low_risk_threshold: 0.35

  # Signal weights (must sum to 1.0). A modality with no data for the stream (no chat replay,
  # no most-replayed heatmap) is dropped and the remaining weights renormalize.
  weights:
    loudness: 0.20
    chat_velocity: 0.20
    heatmap: 0.20         # YouTube 'Most replayed' viewer-rewatch heatmap
    llm_score: 0.40

  # YouTube 'Most replayed' heatmap (free via yt-dlp). Bins are coarse (~1/100 of the video), so
  # peaks are regional boosts, not exact clip boundaries.
  heatmap:
    enabled: true
    threshold_std: 1.0          # peak = value >= mean + N*std ...
    min_value: 0.5              # ... and >= this absolute heat (0..1)
    quiet_boost_min_heat: 0.7   # heat >= this + LLM score >= 7 -> quiet-moment score floor

  loudness:
    threshold_std: 2.5     # std deviations above mean
    window_seconds: 2      # RMS frame window
    merge_gap_seconds: 5   # merge spikes within N seconds

  chat:
    window_seconds: 10     # bin size for counting messages
    prominence_factor: 3.0 # std deviations for spike
    min_messages: 50       # skip chat analysis if fewer total messages

llm:
  provider: "ollama"       # ollama (standalone mode)
  model: "auto"            # auto | qwen3:8b | qwen3:4b | any Ollama model
  base_url: "http://localhost:11434"
  temperature: 0.3
  timeout_seconds: 120

video:
  format: "mp4"
  resolution: [1080, 1920]  # width x height (9:16)
  fps: 30
  codec: "auto"             # auto (h264_nvenc if CUDA+NVENC else libx264) | h264_nvenc | libx264
  audio_codec: "aac"
  game_fit: "cinema_split"  # cinema_split (wide-safe 9:16 layout) | full_bleed (zero black bars, 1080x1280 bottom 66.7%) | full (16:9 game area) | balanced (4:3 centre crop, taller game area)
  blur_fill_game_scale: 1.15  # blur_fill layout: game width as a multiple of frame width (centre-cropped horizontally; 1.0-1.3). Higher = taller game, more cropped sides
  crf: 19                   # quality (libx264 -crf / h264_nvenc -cq, lower = better, 18-28 range; 19 = high quality)
  preset: "p4"              # nvenc preset (p1-p7, p4 = balanced) / libx264 preset (medium)
  libx264_preset: "medium"  # preset when libx264 encoder is used (ultrafast, veryfast, medium, slow)
  bitrate: "12M"            # target video bitrate for high-motion gaming (12 Mbps)
  maxrate: "16M"            # maximum video bitrate (16 Mbps)
  bufsize: "24M"            # rate control buffer size (24 Mbps)

captions:
  style: "hormozi"           # hormozi | single_word | sentence | bounce | pop | karaoke | box
  words_per_group: 3         # words visible at once (hormozi/bounce/pop/karaoke/box style)
  font: "Impact"
  font_size: 82
  color: "white"
  highlight_color: "#FFE600"  # electric gold for active word (converted dynamically to ASS BGR &H00E6FF&)
  stroke_color: "black"
  stroke_width: 8
  shadow_offset: 6           # Drop shadow depth in pixels (6 = deep 3D shadow; 0 = disabled)
  shadow_color: "&H90000000" # Drop shadow color (#RRGGBB, named color, or ASS &HAABBGGRR)
  box_style: false           # Render subtitles with background box (BorderStyle=3)
  box_color: "black"         # Background box color when box_style is true
  box_opacity: 0.60          # Background box opacity (0.0 transparent to 1.0 fully opaque)
  box_padding: 6             # Padding around text for background box
  animation: "bounce"        # none | pop | bounce | sweep (word pop/bounce scaling or color sweep)
  animation_scale: 1.30      # Scale multiplier for pop/bounce animation (1.30 = 130%)
  animation_duration_ms: 140 # Duration of animation phase in milliseconds
  position_y_ratio: 0.75     # 75% down the screen
  rotate_styles: true        # Rotate style_presets per streamer so clips don't share one template look
  style_presets:             # Word-caption / narration-card looks (font falls back automatically if missing)
    - {font: "Impact", primary_color: "#FFFFFF", highlight_color: "#00FF66", outline_color: "#000000", stroke_width: 8, shadow_offset: 6, shadow_color: "&H90000000", animation: "bounce"}      # Neon Green Pop
    - {font: "Impact", primary_color: "#FFFFFF", highlight_color: "#FFE600", outline_color: "#000000", stroke_width: 8, shadow_offset: 6, shadow_color: "&H90000000", animation: "pop"}         # Electric Gold Pop
    - {font: "Impact", primary_color: "#FFFFFF", highlight_color: "#00F0FF", outline_color: "#000000", stroke_width: 8, shadow_offset: 6, shadow_color: "&H90000000", animation: "bounce"}      # Cyber Cyan Pop
    - {font: "Impact", primary_color: "#FFFFFF", highlight_color: "#FF2A2A", outline_color: "#000000", stroke_width: 8, shadow_offset: 6, shadow_color: "&H90000000", animation: "pop"}         # Fire Crimson Pop

hook_title:
  enabled: true
  duration_seconds: 4
  font: "Arial-Bold"
  font_size: 50
  color: "white"
  stroke_color: "black"
  stroke_width: 3
  position: "top"            # top | center
  fade_in: true

hooks:
  persistent_title: true     # blur_fill layout: keep the hook title (and badge) on screen for the whole clip (false = hook_title.duration_seconds)
  streamer_tag: true         # blur_fill layout: small "@streamer" credit pill at the bottom of the hook band

metadata:
  hashtag_count: 4
  include_streamer_tag: true
  include_game_tag: true

output:
  structure: "{game}/{streamer}/{date}"  # folder template
  filename_template: "clip_{index:02d}"
  save_metadata_json: true
  save_transcript_txt: true
  max_final_seconds: 55                # Hard cap on final clip length (Shorts limit up to 3m)
  max_clips_per_streamer_per_day: 3    # Extra clips are routed to queued_dir
  queued_dir: "queued"                 # Sub-folder for clips over the daily cap
  write_post_file: true                # Write a ready-to-paste post .txt next to each clip
  min_commentary_ratio: 0.35           # Minimum share of narration vs. stream audio (YPP transformative); measured after export, below this the clip JSON gets low_commentary: true
  require_narration: true              # Hard gate: a non-raw clip whose narration mix did not run is quarantined, never shipped silent
  quarantine_dir: "_quarantine"        # Sub-folder of the output dir (game/streamer/date below it) for clips that failed the narration gate

facecam:
  min_area_ratio: 0.002
  max_area_ratio: 0.25
  min_detection_ratio: 0.6             # Share of sampled frames that must contain a face
  max_center_jitter: 0.05              # Max std of face centre / frame size (stable facecam overlay)
  overrides: {}                        # {streamer: [x, y, w, h]} normalized 0-1 manual facecam boxes
  profiles_path: ""                    # "" = <general.cache_dir>/facecam_profiles.json

content_gate:
  enabled: true
  letterbox_ratio: 0.10                # Black rows (top+bottom) as share of height
  static_threshold: 2.0                # Mean abs frame diff (0-255) below this = static scene

transformation:
  enabled: true                        # Enable YPP anti-reused-content transformation
  mode: "auto"                         # auto (story/breakdown/narrative) | narrative | story | breakdown | raw
  breakdown_style: "instant_replay"    # instant_replay (play clip + slow-mo replay) | freeze_frame
  replay_speed: 0.5                    # Slow-motion factor for instant replay
  replay_duration_seconds: 5.0         # Climax duration replayed in instant replay
  replay_badge_text: "🔴 INSTANT REPLAY"
  breakdown:
    default_kind: "auto"              # auto | slow_mo | zoom_spotlight
    replay_window: 5.0
    slow_mo: 0.5
    freeze_duration: 4.0
    freeze_zoom: 1.35
    zoom_spotlight:
      duration: 4.5                   # Matched to breakdown voiceover duration
      zoom_scale: 2.2                 # 2.2x zoom into target ROI
      ease_in_seconds: 1.2            # Sinusoidal ease-in zoom
      ease_out_seconds: 1.0           # Sinusoidal ease-out zoom
      badge_text: "🔍 EVIDENCE BREAKDOWN"
      fullscreen_takeover: true       # Full 9:16 vertical takeover for mobile legibility
  narration_style: "intro_and_breakdown" # intro_and_breakdown | breakdown_only
  tts_engine: "auto"                   # auto (kokoro -> edge-tts) | kokoro | edge-tts | elevenlabs | none
  tts_voice: "am_puck"                 # Energetic Kokoro voice ID (fallback: am_fenrir)
  edge_tts_voice: "en-US-AndrewMultilingualNeural" # Edge-TTS voice ID (used when engine is edge-tts or auto fallback)
  elevenlabs_voice_id: ""              # ElevenLabs voice for English narration (uses ELEVENLABS_API_KEY from env or .env)
  elevenlabs_hinglish_voice_id: ""     # ElevenLabs voice for Hinglish narration ("" = use elevenlabs_voice_id)
  elevenlabs_model_id: "eleven_v4"     # Use the model your ElevenLabs voices were designed with (eleven_v4, eleven_v4_turbo, eleven_v3, eleven_multilingual_v2)
  elevenlabs_voice_settings:
    stability: 0.40        # Matched to dashboard screenshot
    similarity_boost: 0.85 # Matched to dashboard screenshot
  elevenlabs_output_format: "mp3_44100_128"
  tts_engines: [chatterbox, kokoro, edge-tts]  # Fallback chain, tried in order; ElevenLabs is auto-prepended when ELEVENLABS_API_KEY (env or .env) and elevenlabs_voice_id are set
  narration_language: "auto"            # auto | english | hinglish (auto = Hinglish when the transcript is Hindi/Urdu)
  streamer_languages: {}                # per-streamer override, case-insensitive, e.g. {CarryisLive: hinglish}
  hinglish_tts_engines: [elevenlabs, edge-tts]   # English-only engines (chatterbox turbo, kokoro) are never used for Hinglish
  hinglish_edge_tts_voice: "en-IN-PrabhatNeural" # Indian-English Edge voice reads Roman Hinglish best
  tts_external_python: ".venv-tts/Scripts/python.exe"  # Separate venv for engines with conflicting deps
  tts_reference_wav: ""                # Voice-clone reference WAV ("" = engine default voice)
  tts_speed: 1.0           # Native 1.0x speed matching dashboard
  tts_retries: 1                       # Extra full passes over the TTS engine chain (0.5 s apart) when every engine failed
  edge_tts_rate: "+10%"
  target_lufs: -14                     # Final loudness normalization target
  narration_gain_db: 0.0   # Clean unity gain (no artificial digital boost)
  bgm_path: ""                         # path to an .mp3/.wav file or directory of tracks; "" = disabled
  bgm_volume_db: -26.0                 # quiet background level under speech
  crossfade_seconds: 0.25              # Ramp at every duck transition
  callout_enabled: true                # Short spoken callout over the key moment
  persona: "high-energy gamer friend reacting live — hyped, funny, talks straight to the viewer"
  enable_top3: true                    # Allow top-3 compilation clips (mode: top3)
  top3_item_seconds: 14
  format_rotation: [narrative, story, breakdown]
  breakdown_moment_types: [clutch, fail, graphics_detail, analysis]  # ONLY these moment types may use breakdown (instant replay); needs breakdown_commentary + a peak inside the clip. Reactions (hype/funny/chat_chaos/lore_secret) get narrative/story
  hook_styles: [question, hot_take, countdown, nobody_noticed]
  duck_stream_volume: 0.18             # Duck original stream audio to 18% during narrator voiceover
  punch_in_zoom: 1.20                  # 1.20x center zoom around peak_time (1.0 = disabled)
  zoom_duration_seconds: 3.5           # Duration of punch-in zoom at peak moment
  show_chat_ticker: true               # Render real live_chat burst overlay during spike

refinement:
  enabled: true                        # Enable 5-minute context refinement
  window_before: 120.0                 # Seconds before proposed timestamp (Sheet 1 buildup)
  window_after: 60.0                   # Seconds after proposed timestamp (Sheet 2 climax/reaction)
  engine: "auto"                       # auto (gemini if GEMINI_API_KEY set, else ollama) | gemini | ollama | mcp
  gemini_model: "gemini-2.5-flash"     # Free-tier Gemini model for boundary refinement
  gemini_api_key_env: "GEMINI_API_KEY" # Env var name for the API key
  chat_bucket_seconds: 5.0             # Chat velocity bucket size for context window
  chat_latency_compensation: 18.0      # Seconds to shift chat spikes backward
  finale_window_minutes: 20            # Always include last N minutes as candidates
  vision:
    compulsory: true                   # Always extract & verify visual contact sheets
    proxy_height: 360                  # Fast lightweight 360p download (~5-8 MB)
    grid: 3                            # 3x3 tiles per contact sheet
    sheet_seconds: 90.0                # 90s per sheet (1 tile every 10s)
    label_timestamps: true             # Burn yellow MM:SS labels on each tile

library:
  db_path: ""                      # "" = <general.cache_dir>/library.sqlite
  window_seconds: 30
  window_step_seconds: 20
  max_chat_chars_per_window: 600
  heat_boost: 0.3
  frames:
    sheet_seconds: 90
    grid: 3
    sheet_width: 1152
    proxy_height: 360
    note_weight: 0.8
  vision:
    model: "qwen2.5vl:3b"

topics:
  min_evidence: 6
  min_sources: 2
  max_evidence: 12
  similarity_threshold: 0.5
  ledger_name: "topics_ledger.json"
  long_min_seconds: 480
  long_max_seconds: 600
  min_narration_ratio: 0.40
  max_clip_seconds: 20
  max_official_clip_seconds: 10
  short_min_seconds: 35
  short_max_seconds: 180

longform:
  width: 1920
  height: 1080
  fps: 30
  card_seconds: 1.2
  broll_volume: 0.12
  credit_seconds: 4.0
  kenburns_max_zoom: 1.08
  transition_sfx_path: ""

channels:
  en:
    output_dir: "./output/en"
    narration_language: "english"
    ledger_name: "topics_ledger_en.json"
    discovery_language: "en-US"
    discovery_region: "US"
  hi:
    output_dir: "./output/hi"
    narration_language: "hinglish"
    ledger_name: "topics_ledger_hi.json"
    discovery_language: "hi"
    discovery_region: "IN"


